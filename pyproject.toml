[project]
name = "bww"
version = "0.1.0"
authors = [
    {name = "SharzyL", email = "me@sharzy.in"},
]
dependencies = [
    # KDL v2 (triple-quoted strings etc.) only landed on tabatkins/kdlpy
    # main; pin to git until a v2-capable release ships to PyPI.
    "kdl-py @ git+https://github.com/tabatkins/kdlpy.git@main",
    "loguru>=0.7",
]
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
bww = "bww:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
format.quote-style = "single"
lint.select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "basedpyright>=1.39",
    "pytest>=9.0.2",
]

[tool.basedpyright]
include = ["src", "tests"]
# "standard" gives the same checks as upstream pyright. "all" / "strict"
# add many `reportAny` / `reportUnknownMemberType` warnings that are noisy
# for argparse-driven code and registry dispatch.
typeCheckingMode = "standard"
pythonVersion = "3.12"
# kdl-py doesn't declare __all__; its documented surface (parse/Node/ParseError)
# triggers reportPrivateImportUsage. Treat the package as public.
reportPrivateImportUsage = "none"
